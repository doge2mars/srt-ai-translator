name: Build Safari Extension (macOS)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'manifest.json'
      - 'src/**'
      - 'icons/**'
      - '.github/workflows/build-safari.yml'

jobs:
  build-safari:
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Stage clean extension files
        run: |
          mkdir -p /tmp/ext-src
          cp manifest.json /tmp/ext-src/
          cp -R icons src /tmp/ext-src/

      - name: Convert Web Extension to Safari Xcode project
        run: |
          xcrun safari-web-extension-converter /tmp/ext-src \
            --project-location /tmp/safari-proj \
            --app-name "SRT AI Translator" \
            --bundle-identifier "com.local.srt-ai-translator" \
            --macos-only \
            --swift \
            --no-open \
            --no-prompt

      - name: Build unsigned macOS App
        run: |
          set -o pipefail
          # Create a temporary self-signed code-signing certificate so ValidateEmbeddedBinary sees matching .app/.appex signatures
          cat > /tmp/cert.cfg <<'EOF'
          [ req ]
          default_bits = 2048
          distinguished_name = req_dn
          prompt = no
          x509_extensions = v3_codesign
          [ req_dn ]
          CN = SRT AI Local Build
          [ v3_codesign ]
          keyUsage = digitalSignature
          extendedKeyUsage = codeSigning
          EOF
          openssl req -x509 -newkey rsa:2048 -nodes -keyout /tmp/key.pem -out /tmp/cert.pem -days 1 -config /tmp/cert.cfg
          openssl pkcs12 -export -legacy -out /tmp/cert.p12 -inkey /tmp/key.pem -in /tmp/cert.pem -passout pass:buildpass 2>/dev/null || \
            openssl pkcs12 -export -out /tmp/cert.p12 -inkey /tmp/key.pem -in /tmp/cert.pem -passout pass:buildpass
          KEYCHAIN=/tmp/build.keychain-db
          security create-keychain -p buildpass "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN" login.keychain-db
          security default-keychain -s "$KEYCHAIN"
          security unlock-keychain -p buildpass "$KEYCHAIN"
          security import /tmp/cert.p12 -k "$KEYCHAIN" -P buildpass -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k buildpass "$KEYCHAIN"
          security add-trusted-cert -r trustRoot -k "$KEYCHAIN" /tmp/cert.pem || true
          security find-identity -v -p codesigning "$KEYCHAIN"

          XCODEPROJ=$(find /tmp/safari-proj -maxdepth 3 -name "*.xcodeproj" | head -n 1)
          echo "Found Xcode project: $XCODEPROJ"
          xcodebuild -list -json -project "$XCODEPROJ"
          SCHEME=$(xcodebuild -list -json -project "$XCODEPROJ" | python3 -c "import sys,json; s=json.load(sys.stdin)['project']['schemes']; print(s[0])")
          echo "Using scheme: $SCHEME"
          xcodebuild \
            -project "$XCODEPROJ" \
            -scheme "$SCHEME" \
            -configuration Release \
            -destination 'platform=macOS' \
            -derivedDataPath /tmp/safari-build \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="SRT AI Local Build" \
            CODE_SIGNING_REQUIRED=YES \
            DEVELOPMENT_TEAM="" \
            PROVISIONING_PROFILE_SPECIFIER="" \
            OTHER_CODE_SIGN_FLAGS="--keychain $KEYCHAIN" \
            build 2>&1 | tee /tmp/xcodebuild.log

      - name: Print build error summary on failure
        if: failure()
        run: |
          echo "### xcodebuild error tail" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          grep -i -E "error:|fatal:|signing|provisioning|scheme" /tmp/xcodebuild.log | tail -n 30 >> "$GITHUB_STEP_SUMMARY" || tail -n 40 /tmp/xcodebuild.log >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Package .app as zip
        run: |
          APP_PATH=$(find /tmp/safari-build/Build/Products/Release -maxdepth 2 -name "*.app" | head -n 1)
          echo "Found built app: $APP_PATH"
          mkdir -p dist
          ditto -c -k --keepParent "$APP_PATH" dist/SRT-AI-Translator-Safari-macOS.zip
          ls -lh dist/SRT-AI-Translator-Safari-macOS.zip

      - name: Upload Safari App artifact
        uses: actions/upload-artifact@v4
        with:
          name: SRT-AI-Translator-Safari-macOS
          path: dist/SRT-AI-Translator-Safari-macOS.zip
          retention-days: 30
